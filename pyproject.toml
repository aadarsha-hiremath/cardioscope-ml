[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cardioscope-ml"
version = "0.1.0"
description = "Reproducible heart-disease classification and hospital transfer research"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["pandas==2.3.3", "scikit-learn==1.9.1", "xgboost==3.4.1", "threadpoolctl>=3.1,<4", "matplotlib==3.10.8"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.12,<0.15", "mypy>=1.16,<2", "pandas-stubs>=2.3.3,<3"]
dashboard = ["streamlit==1.67.0", "plotly==7.1.0", "SQLAlchemy==2.1.9", "argon2-cffi==25.1.0"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
cardioscope-audit = "cardioscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# These upstream modules ship without PEP 561 metadata. Project code remains strict.
[[tool.mypy.overrides]]
module = ["sklearn.compose", "sklearn.impute", "sklearn.model_selection", "sklearn.pipeline", "sklearn.preprocessing", "sklearn.linear_model", "sklearn.ensemble", "sklearn.metrics", "threadpoolctl"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["plotly.*", "joblib"]
ignore_missing_imports = true
